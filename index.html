        body {

            background-size: cover;
            background-color: #1A2536;

            min-height: 100vh;
            margin: 0;
            
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F1F1F1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #D1A3B0;
            border-radius: 10px;

<body class="flex flex-col min-h-screen items-center justify-start gap-4 p-4">

    <header class="text-center my-3">
        <h1 class="text-2xl font-bold tracking-wider text-white">Z's</h1>
        <p class="text-xs text-white tracking-widest mt-0.5">Design Your Own Bracelet.</p>
    </header>

    <main class="w-full max-w-md flex flex-col gap-4 bg-white/85 backdrop-blur-md p-4 rounded-3xl shadow-lg">

        <section class="flex flex-col items-center bg-white p-4 rounded-2xl shadow-inner">
            <div class="text-xs font-medium text-gray-400 mb-3 tracking-wide">手鍊設計預覽 (請選擇6～8個模塊)</div>
    
            <div class="w-full overflow-x-auto pb-10 pt-1">
                <div id="bracelet-slots" class="flex items-center justify-start sm:justify-center min-h-[55px] gap-1 px-1 min-w-max">
                    <!-- 動態生成 -->
                </div>
            </div>

            <div class="w-full mt-8 mb-4">
                <input type="text" id="user-note" placeholder="選擇字母模塊請在此備註想要的字母" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-xs text-gray-700 focus:outline-none focus:border-pink-400 focus:ring-1 focus:ring-pink-400 transition-colors">
            </div>

            <div class="flex gap-3 mt-4 w-full">
                <button onclick="clearBracelet()" class="flex-1 py-2 px-3 text-xs font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-xl transition-all">
                    全部清除
                </button>
                <button onclick="generateDesignImage()" class="flex-[2] py-2 px-3 text-xs font-medium text-white bg-amber-900 hover:bg-amber-950 active:text-white rounded-xl shadow-md transition-all">
                    生成專屬設計圖
                </button>
            </div>
        </section>

        <!-- 模塊挑選區 -->
        <section class="flex flex-col bg-white p-3 rounded-2xl border border-pink-200/60">
            <div id="category-tabs" class="flex gap-1.5 overflow-x-auto pb-2 border-b border-gray-100">
                <!-- 動態生成分類 -->
            </div>

            <div id="charms-container" class="grid grid-cols-3 gap-2.5 pt-3 max-h-[220px] overflow-y-auto px-1">
                <!-- 動態生成模塊 -->
            </div>
        </section>

    </main>

    <footer class="text-center text-[10px] text-gray-400 mt-4">
        © 2026 Z's 粒子. All Rights Reserved.
    </footer>

    <!-- 彈出式結果 Modal -->
    <div id="result-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-5 max-w-xs w-full flex flex-col items-center shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold transition-all">
                ✕
            </button>
            <h3 class="text-sm font-bold text-gray-800 mb-1">您的專屬設計圖已完成！</h3>
            <p class="text-[11px] text-gray-400 mb-4">太好看了吧！私訊我們帶它回家</p>
            
            <div id="image-output-container" class="w-full aspect-square bg-[#FDEFF2] rounded-2xl overflow-hidden shadow-inner flex items-center justify-center border border-pink-100">
            </div>
            <div id="display-user-note" class="mt-3 text-center text-sm text-gray-700 font-medium"></div>
            <div class="mt-4 text-center">
                <span class="inline-block bg-amber-100 text-pink-950 text-[11px] font-medium px-3 py-1.5 rounded-full border border-amber-800">
                    ⬆️ 手機請長按圖片儲存至相簿
                </span>
            </div>
        </div>
    </div>

        let bracelet = [];
        let currentCategory = 'c4';

        function init() {
            renderTabs();
            renderCharms();
            renderBracelet();
        }

        function renderTabs() {
            const container = document.getElementById('category-tabs');
            container.innerHTML = categories.map(cat => `
                <button onclick="switchCategory('${cat.id}')" 
                    class="px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all ${currentCategory === cat.id ? 'bg-amber-900 text-white shadow-sm' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}">
                    ${cat.name}
                </button>
            `).join('');
        }

        function switchCategory(catId) {
            currentCategory = catId;
            renderTabs();
            renderCharms();
        }

        function renderCharms() {
            const container = document.getElementById('charms-container');
            const filteredCharms = charms.filter(c => c.categoryId === currentCategory);

            container.innerHTML = filteredCharms.map(charm => {
                const isC6 = charm.categoryId === 'c6';
                const wrapperClass = isC6 
                    ? "w-10 h-12 bg-white border border-gray-200 flex items-center justify-center relative rounded z-10" 
                    : "w-10 h-8 rounded overflow-hidden bg-white border border-gray-200 flex items-center justify-center";
                    
                const imgClass = isC6 
                    ? "w-8 h-10 object-contain translate-y-1" 
                    : "w-full h-full object-cover";

                return `
                    <button onclick="addCharm(${charm.id})"
                        class="flex flex-col items-center justify-between p-1.5 bg-gray-50 hover:bg-pink-50 active:scale-95 rounded-xl border border-gray-100 transition-all min-h-[75px]">
                        <div class="${wrapperClass}">
                            <img src="${charm.src}" alt="${charm.name}" class="${imgClass}" />
                        </div>
                        <span class="text-[10px] text-gray-500 mt-1">${charm.name}</span>
                    </button>
                `;
            }).join('');
        }

        function renderBracelet() {
            const container = document.getElementById('bracelet-slots');
            let slotsHTML = '';

            for (let i = 0; i < 8; i++) {
                if (i < bracelet.length) {
                    const charm = bracelet[i];
                    const isC6 = charm.categoryId === 'c6';

                    const scale = charm.scale || 148;
                    const offsetY = charm.offsetY || 0;

                    const containerStyle = isC6 
                        ? 'w-[50px] h-[40px] bg-white flex items-start justify-center cursor-pointer relative z-20 overflow-visible border-t-2 border-b-2 border-r-2 border-gray-300' 
                        : 'w-[50px] h-[40px] bg-white flex items-center justify-center cursor-pointer overflow-hidden relative z-10 border-t-2 border-b-2 border-r-2 border-gray-300';

                    const firstSlotClass = i === 0 ? 'rounded-l-md border-l-2' : '';

                    const imgStyle = isC6 
                        ? 'max-w-none h-auto absolute top-0 left-1/2 -translate-x-1/2 pointer-events-none' 
                        : 'w-full h-full object-cover';

                    const inlineStyle = isC6 
                        ? `width: ${scale}%; top: ${offsetY}px;` 
                        : '';

                    slotsHTML += `
                        <div onclick="removeCharm(${i})" title="點擊移除" 
                            class="${containerStyle} ${firstSlotClass}"
                            style="box-sizing: border-box; box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);">
                            <img src="${charm.src}" alt="${charm.name}" class="${imgStyle}" style="${inlineStyle}" />
                        </div>
                    `;
                } else {
                    slotsHTML += `
                        <div class="w-[50px] h-[40px] border border-dashed border-gray-300 bg-gray-50/50 flex items-center justify-center text-gray-200 text-xs box-border
                            ${i === 0 ? 'rounded-l-md border-l' : '-ml-[1px]'}">
                            ·
                        </div>
                    `;
                }
            }
            container.innerHTML = slotsHTML;
        }

        function addCharm(charmId) {
            if (bracelet.length >= 8) {
                showToast('最多只能選8個模塊哦！');
                return;
            }
            const charm = charms.find(c => c.id === charmId);
            if (charm) {
                bracelet.push({ ...charm, uniqueId: Date.now() + Math.random() });
                renderBracelet();
            }
        }

        function removeCharm(index) {
            bracelet.splice(index, 1);
            renderBracelet();
        }

        function clearBracelet() {
            bracelet = [];
            renderBracelet();
            showToast('已清空手鍊');
        }

        // 圖片生成引擎 (修復8個模塊自適應放大的版本)
        function generateDesignImage() {
            if (bracelet.length === 0) {
                showToast('請至少選擇一個模塊再生成設計圖！');
                return;
            }
            const noteText = document.getElementById('user-note').value;

            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 800;
            const ctx = canvas.getContext('2d');

            // 1. 米粉色底色
            ctx.fillStyle = '#fdfdf7';
            ctx.fillRect(0, 0, 800, 800);

            // 2. 標題與副標題
            ctx.fillStyle = '#1F2937';
            ctx.font = 'bold 42px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("Z's", 400, 115);

            ctx.fillStyle = '#9CA3AF';
            ctx.font = '18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText("Design Your Own Bracelet.", 400, 150);

            // 3. 備註文字
            if (noteText.trim() !== "") {
                ctx.fillStyle = '#4B5563';
                ctx.font = '28px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("備註：" + noteText, 400, 720);
            }

            // 4. 動態計算模塊尺寸，確保滿 8 個時完美容納，不被切掉
            const count = bracelet.length;
            const charmWidth = count > 6 ? 82 : (count > 4 ? 92 : 110); 
            const charmHeight = Math.round(charmWidth * (122 / 110)); 
            const totalWidth = count * charmWidth;
            
            const cardWidth = Math.min(740, totalWidth + 60); 
            const cardX = (800 - cardWidth) / 2;
            const cardY = 270;

            // 繪製大白色卡片
            ctx.fillStyle = '#FFFFFF';
            ctx.roundRect(cardX, cardY, cardWidth, 250, 28);
            ctx.fill();
            ctx.strokeStyle = '#FCE7F0';
            ctx.lineWidth = 3;
            ctx.stroke();

            const startX = (800 - totalWidth) / 2;
            const startY = cardY + (250 - charmHeight) / 2;

            let loadedImages = 0;
            const imgObjects = [];

            bracelet.forEach((item, index) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.src = item.src;
                img.onload = () => {
                    loadedImages++;
                    imgObjects[index] = img;
                    if (loadedImages === bracelet.length) {
                        drawCanvasFinal(ctx, canvas, startX, startY, charmWidth, charmHeight, imgObjects);
                    }
                };
                img.onerror = () => {
                    loadedImages++;
                    imgObjects[index] = null;
                    if (loadedImages === bracelet.length) {
                        drawCanvasFinal(ctx, canvas, startX, startY, charmWidth, charmHeight, imgObjects);
                    }
                };
            });
        }

        function drawCanvasFinal(ctx, canvas, startX, startY, charmWidth, charmHeight, imgObjects) {
    bracelet.forEach((item, index) => {
        const x = startX + (index * charmWidth);
        const y = startY;
        const isC6 = item.categoryId === 'c6';

        // 1. 畫每個模塊的白底與灰色金屬外框 (確保每個模塊 100% 同寬同高)
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(x, y, charmWidth, charmHeight);

        if (imgObjects[index]) {
            const img = imgObjects[index];

            if (isC6) {
                // ✨ 吊墜精準對齊邏輯：
                // 1. 讀取 scale (如 125~130%)，計算放大後的寬度與高度
                const scale = (item.scale || 100) / 100;
                const drawW = charmWidth * scale;
                const drawH = drawW * (img.height / img.width);
                
                // 2. 水平置中，Y 軸精準對齊模塊頂部 (可由 offsetY 微調 ± 像素)
                const offsetY = item.offsetY || 0;
                const drawX = x - (drawW - charmWidth) / 2;
                const drawY = y + offsetY; 

                // 3. 一次性完整繪製，絕不重疊、絕不重影！
                ctx.drawImage(img, drawX, drawY, drawW, drawH);
            } else {
                // 一般模塊等比例居中，保持不變形
                const imgRatio = img.width / img.height;
                const boxRatio = charmWidth / charmHeight;

                let drawW = charmWidth;
                let drawH = charmHeight;
                let drawX = x;
                let drawY = y;

                if (imgRatio > boxRatio) {
                    drawH = charmWidth / imgRatio;
                    drawY = y + (charmHeight - drawH) / 2;
                } else {
                    drawW = charmHeight * imgRatio;
                    drawX = x + (charmWidth - drawW) / 2;
                }

                ctx.drawImage(img, drawX, drawY, drawW, drawH);
            }
        }

        // 2. 畫灰色模塊外框線 (讓所有模塊的金屬上、下框線完美排在一條水平線上)
        ctx.strokeStyle = '#D1D5DB';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(x, y, charmWidth, charmHeight);
    });

    const dataURL = canvas.toDataURL('image/png');
    const outputContainer = document.getElementById('image-output-container');
    outputContainer.innerHTML = `<img src="${dataURL}" alt="專屬設計圖" class="w-full h-full object-contain rounded-2xl" />`;

    document.getElementById('result-modal').classList.remove('hidden');
    document.getElementById('result-modal').classList.add('flex');
}       

        function closeModal() {
            document.getElementById('result-modal').classList.remove('flex');
            document.getElementById('result-modal').classList.add('hidden');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        window.onload = init;
    </script>
</body>
</html>
