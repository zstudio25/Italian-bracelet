<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z's 粒子 - 專屬模塊手鍊試穿間</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #FDEFF2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F1F1F1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #D1A3B0;
            border-radius: 10px;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen items-center justify-between p-4">

    <header class="text-center my-3">
        <h1 class="text-2xl font-bold tracking-wider text-gray-800">Z's 粒子</h1>
        <p class="text-xs text-gray-500 tracking-widest mt-0.5">CUSTOM CHARM BRACELET</p>
    </header>

    <main class="w-full max-w-md flex flex-col gap-4 bg-white/85 backdrop-blur-md p-4 rounded-3xl shadow-lg border border-pink-100">

        <!-- 手鍊展示台 -->
        <section class="flex flex-col items-center bg-white p-4 rounded-2xl border border-pink-200/60 shadow-inner">
            <div class="text-xs font-medium text-gray-400 mb-3 tracking-wide">您的手鍊設計預覽 (最多 6 顆)</div>
            
            <div id="bracelet-slots" class="flex items-center justify-center min-h-[55px]">
                <!-- 動態生成 -->
            </div>

            <div class="flex gap-3 mt-4 w-full">
                <button onclick="clearBracelet()" class="flex-1 py-2 px-3 text-xs font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-xl transition-all">
                    🗑️ 全部清除
                </button>
                <button onclick="generateDesignImage()" class="flex-[2] py-2 px-3 text-xs font-medium text-white bg-pink-400 hover:bg-pink-500 rounded-xl shadow-md transition-all">
                    ✨ 產生專屬設計圖
                </button>
            </div>
        </section>

        <!-- 模塊挑選區 -->
        <section class="flex flex-col bg-white p-3 rounded-2xl border border-pink-200/60">
            <div id="category-tabs" class="flex gap-1.5 overflow-x-auto pb-2 border-b border-gray-100">
                <!-- 動態生成分類 -->
            </div>

            <div id="charms-container" class="grid grid-cols-3 gap-2.5 pt-3 max-h-[220px] overflow-y-auto px-1">
                <!-- 動態生成模塊 -->
            </div>
        </section>

    </main>

    <footer class="text-center text-[10px] text-gray-400 mt-4">
        © 2026 Z's 粒子. All Rights Reserved.
    </footer>

    <!-- 彈出式結果 Modal -->
    <div id="result-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-5 max-w-xs w-full flex flex-col items-center shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold transition-all">
                ✕
            </button>
            <h3 class="text-sm font-bold text-gray-800 mb-1">您的專屬設計圖已完成！</h3>
            <p class="text-[11px] text-gray-400 mb-4">請長按下方圖片儲存，並私訊給小幫手下單</p>
            
            <div id="image-output-container" class="w-full aspect-square bg-[#FDEFF2] rounded-2xl overflow-hidden shadow-inner flex items-center justify-center border border-pink-100">
            </div>

            <div class="mt-4 text-center">
                <span class="inline-block bg-pink-50 text-pink-500 text-[11px] font-medium px-3 py-1.5 rounded-full border border-pink-200">
                    👆 手機請長按圖片儲存至相簿
                </span>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-gray-800/90 text-white text-xs px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50">
        提示訊息
    </div>

    <script>
        const categories = [
            { id: 'c1', name: '💎 經典金屬' },
            { id: 'c2', name: '🌸 甜美風格' },
            { id: 'c3', name: '✨ 應援限定' }
        ];

        // 這裡使用真實圖片的 Base64 或線上圖片範例（此處以高畫質精美圖標示範，你之後可以換成你的商品去背圖 Base64）
        const charms = [
            { id: 1, categoryId: 'c1', name: '精緻皇冠', type: 'img', src: 'https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=150&auto=format&fit=crop&q=80' },
            { id: 2, categoryId: 'c1', name: '閃耀鑽戒', type: 'img', src: 'https://images.unsplash.com/photo-1605100804763-247f67b3557e?w=150&auto=format&fit=crop&q=80' },
            { id: 3, categoryId: 'c1', name: '金屬蝴蝶', type: 'img', src: 'https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?w=150&auto=format&fit=crop&q=80' },
            { id: 4, categoryId: 'c2', name: '甜美粉蝶', type: 'img', src: 'https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=150&auto=format&fit=crop&q=80' },
            { id: 5, categoryId: 'c2', name: '愛心粉鑽', type: 'img', src: 'https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?w=150&auto=format&fit=crop&q=80' },
            { id: 6, categoryId: 'c3', name: '應援寶石', type: 'img', src: 'https://images.unsplash.com/photo-1605100804763-247f67b3557e?w=150&auto=format&fit=crop&q=80' }
        ];

        let bracelet = [];
        let currentCategory = 'c1';

        function init() {
            renderTabs();
            renderCharms();
            renderBracelet();
        }

        function renderTabs() {
            const container = document.getElementById('category-tabs');
            container.innerHTML = categories.map(cat => `
                <button onclick="switchCategory('${cat.id}')" 
                    class="px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all ${currentCategory === cat.id ? 'bg-pink-400 text-white shadow-sm' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}">
                    ${cat.name}
                </button>
            `).join('');
        }

        function switchCategory(catId) {
            currentCategory = catId;
            renderTabs();
            renderCharms();
        }

        function renderCharms() {
            const container = document.getElementById('charms-container');
            const filteredCharms = charms.filter(c => c.categoryId === currentCategory);

            container.innerHTML = filteredCharms.map(charm => `
                <button onclick="addCharm(${charm.id})" 
                    class="flex flex-col items-center justify-center p-1.5 bg-gray-50 hover:bg-pink-50 active:scale-95 rounded-xl border border-gray-100 transition-all h-[68px]">
                    <div class="w-10 h-8 rounded overflow-hidden bg-white border border-gray-200 flex items-center justify-center">
                        <img src="${charm.src}" alt="${charm.name}" class="w-full h-full object-cover" />
                    </div>
                    <span class="text-[10px] text-gray-500 mt-1">${charm.name}</span>
                </button>
            `).join('');
        }

        function renderBracelet() {
            const container = document.getElementById('bracelet-slots');
            let slotsHTML = '';

            for (let i = 0; i < 6; i++) {
                if (i < bracelet.length) {
                    const charm = bracelet[i];
                    slotsHTML += `
                        <div onclick="removeCharm(${i})" title="點擊移除" 
                            class="w-[50px] h-[40px] bg-white flex items-center justify-center cursor-pointer hover:opacity-80 transition-all overflow-hidden
                            ${i === 0 ? 'border-2 border-gray-300 rounded-l-md' : 'border-t-2 border-b-2 border-r-2 border-gray-300'}"
                            style="box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);">
                            <img src="${charm.src}" alt="${charm.name}" class="w-full h-full object-cover" />
                        </div>
                    `;
                } else {
                    slotsHTML += `
                        <div class="w-[50px] h-[40px] border border-dashed border-gray-300 bg-gray-50/50 flex items-center justify-center text-gray-200 text-xs
                            ${i === 0 ? 'rounded-l-md border-l' : '-ml-[1px]'}">
                            ·
                        </div>
                    `;
                }
            }
            container.innerHTML = slotsHTML;
        }

        function addCharm(charmId) {
            if (bracelet.length >= 6) {
                showToast('最多只能排 6 顆模塊喔！');
                return;
            }
            const charm = charms.find(c => c.id === charmId);
            if (charm) {
                bracelet.push({ ...charm, uniqueId: Date.now() + Math.random() });
                renderBracelet();
            }
        }

        function removeCharm(index) {
            bracelet.splice(index, 1);
            renderBracelet();
        }

        function clearBracelet() {
            bracelet = [];
            renderBracelet();
            showToast('已清空手鍊');
        }

        // 圖片生成引擎 (支援真實圖片繪製)
        function generateDesignImage() {
            if (bracelet.length === 0) {
                showToast('請至少選擇一個模塊再生成設計圖！');
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 800;
            const ctx = canvas.getContext('2d');

            // 1. 粉紅底色
            ctx.fillStyle = '#FDEFF2';
            ctx.fillRect(0, 0, 800, 800);

            // 2. 標題
            ctx.fillStyle = '#1F2937';
            ctx.font = 'bold 36px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("Z's 粒子", 400, 240);

            ctx.fillStyle = '#9CA3AF';
            ctx.font = '16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText("CUSTOM CHARM BRACELET", 400, 280);

            // 3. 白色卡片背景
            ctx.fillStyle = '#FFFFFF';
            ctx.roundRect(100, 340, 600, 160, 24);
            ctx.fill();
            ctx.strokeStyle = '#FCE7F0';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 4. 繪製手鍊模塊
            const charmWidth = 64;
            const charmHeight = 52;
            const totalWidth = 6 * charmWidth;
            const startX = (800 - totalWidth) / 2;
            const startY = 340 + (160 - charmHeight) / 2;

            let loadedImages = 0;
            const imgObjects = [];

            if (bracelet.length === 0) return;

            bracelet.forEach((item, index) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.src = item.src;
                img.onload = () => {
                    loadedImages++;
                    imgObjects[index] = img;
                    if (loadedImages === bracelet.length) {
                        drawCanvasFinal(ctx, canvas, startX, startY, charmWidth, charmHeight, imgObjects);
                    }
                };
                img.onerror = () => {
                    loadedImages++;
                    imgObjects[index] = null;
                    if (loadedImages === bracelet.length) {
                        drawCanvasFinal(ctx, canvas, startX, startY, charmWidth, charmHeight, imgObjects);
                    }
                };
            });
        }

        function drawCanvasFinal(ctx, canvas, startX, startY, charmWidth, charmHeight, imgObjects) {
            bracelet.forEach((item, index) => {
                const x = startX + (index * charmWidth);
                const y = startY;

                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(x, y, charmWidth, charmHeight);

                if (imgObjects[index]) {
                    ctx.drawImage(imgObjects[index], x, y, charmWidth, charmHeight);
                }

                ctx.strokeStyle = '#D1D5DB';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, charmWidth, charmHeight);
            });

            const dataURL = canvas.toDataURL('image/png');
            const outputContainer = document.getElementById('image-output-container');
            outputContainer.innerHTML = `<img src="${dataURL}" alt="專屬設計圖" class="w-full h-full object-contain rounded-2xl" />`;

            document.getElementById('result-modal').classList.remove('hidden');
            document.getElementById('result-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('result-modal').classList.remove('flex');
            document.getElementById('result-modal').classList.add('hidden');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        window.onload = init;
    </script>
</body>
</html>
